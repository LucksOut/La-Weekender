<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>LA Weekender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Public+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: a transit-sign masthead over a filter strip, then a two-up grid of
   event cards. Dates sit in a left block; locations wear freeway-exit-sign green. */
:root {
  --bg: #eceff2;
  --surface: #ffffff;
  --ink: #11181f;
  --muted: #55606b;
  --line: #d3d9df;
  --accent: #ff5a1f;
  --accent-ink: #11181f;
  --sign: #0b6b43;
  --sign-ink: #ffffff;
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1319; --surface: #151d25; --ink: #eef2f5; --muted: #9aa7b3;
    --line: #26323d; --accent: #ff6a33; --accent-ink: #11181f;
    --sign: #0c7a4d; --sign-ink: #ffffff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1319; --surface: #151d25; --ink: #eef2f5; --muted: #9aa7b3;
  --line: #26323d; --accent: #ff6a33; --accent-ink: #11181f;
  --sign: #0c7a4d; --sign-ink: #ffffff; color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 20px 56px; }
* { box-sizing: border-box; }
.wrap { max-width: 1100px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }

header { display: flex; flex-direction: column; gap: 10px; }
.exit { align-self: flex-start; background: var(--sign); color: var(--sign-ink); font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; padding: 3px 12px; border-radius: 4px; outline: 2px solid var(--sign-ink); outline-offset: -5px; }
h1 { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: clamp(52px, 13vw, 104px); line-height: .88; letter-spacing: -.005em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); max-width: 60ch; margin: 0; }
.sub b { color: var(--ink); }

.controls { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
button, input { font: inherit; color: inherit; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 500; font-size: 14px; }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.wk[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.search { flex: 1 1 200px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; }
.search::placeholder { color: var(--muted); }
.sel { flex: 0 1 auto; max-width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; cursor: pointer; }

h2 { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 22px; margin: 4px 0 0; display: flex; align-items: baseline; gap: 10px; }
h2 small { font-family: var(--body); font-size: 13px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; margin: 0; padding: 0; list-style: none; }
.card { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.date { border: 1px solid var(--line); border-radius: 6px; text-align: center; padding: 6px 2px; align-self: start; font-family: var(--display); text-transform: uppercase; }
.date .t { display: block; font-size: 12px; letter-spacing: .14em; color: var(--muted); font-weight: 600; }
.date .n { display: block; font-size: 28px; line-height: 1; font-weight: 800; }
.date .n.s { font-size: 21px; line-height: 1.1; }
.body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.badge { background: var(--accent); color: var(--accent-ink); border-radius: 3px; padding: 1px 6px; }
h3 { font-family: var(--display); font-size: 24px; line-height: 1.05; font-weight: 700; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.when { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.blurb { margin: 0; font-size: 14px; }
.foot { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.place { background: var(--sign); color: var(--sign-ink); font-size: 12px; font-weight: 500; border-radius: 4px; padding: 2px 8px; outline: 1px solid var(--sign-ink); outline-offset: -3px; overflow-wrap: anywhere; }
.price { font-size: 13px; font-weight: 700; }
.src { margin-left: auto; font-size: 13px; color: var(--ink); text-underline-offset: 3px; }

.state { border: 1px dashed var(--line); border-radius: 10px; padding: 28px 18px; text-align: center; color: var(--muted); }
.state button { margin-top: 10px; }
.stamp { color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } .card:hover { border-color: var(--ink); } }
</style>

<div class="wrap">
  <header>
    <span class="exit" id="exit">Exit LA</span>
    <h1>LA Weekender</h1>
    <p class="sub" id="sub">Markets, pop-ups, shows, theme parks, beaches, free days and pizza across Los Angeles.</p>
  </header>

  <div class="controls">
    <div class="chips" id="chips" role="group" aria-label="Filter by type"></div>
    <div class="row">
      <button class="chip wk" id="wk" aria-pressed="false">This weekend</button>
      <select class="sel" id="city" aria-label="City"></select>
      <input class="search" id="q" type="search" placeholder="Search events, places, pizza styles" aria-label="Search events">
    </div>
  </div>

  <main id="out" aria-live="polite">
    <div class="state" id="state">Loading events…</div>
  </main>
  <div class="stamp" id="stamp"></div>
</div>

<script>
(function () {
  var CATS = [
    ["all", "All"], ["markets", "Markets & pop-ups"], ["music", "Shows & events"],
    ["free", "Free"], ["parks", "Parks & seasonal"], ["beach", "Beaches"],
    ["pizza", "Pizza"], ["deals", "Deals"]
  ];
  var CATNAME = { markets: "Market", music: "Show or event", parks: "Seasonal", beach: "Beach", pizza: "Pizza", deals: "Deal" };
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var DOWFULL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var MONFULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  var CITIES = ["Pasadena", "Highland Park", "Downtown LA", "Hollywood", "Long Beach", "Whittier", "Alhambra", "Santa Monica", "Cerritos", "Montebello", "El Monte", "Burbank", "Glendale", "Torrance", "San Fernando"];
  var state = { cat: "all", weekend: false, q: "", city: "" };
  var events = [];
  var phase = "loading"; // loading | signedout | ready

  var $ = function (id) { return document.getElementById(id); };
  var out = $("out");

  function day(iso) { if (!iso) return null; var p = iso.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  var dow = today.getDay();
  var wkStart = (dow === 6 || dow === 0) ? today : addDays(today, 6 - dow);
  var wkEnd = dow === 0 ? today : addDays(wkStart, 1);

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function overlapsWeekend(ev) {
    if (ev.days && ev.days.length && !ev.start) {
      for (var d = new Date(wkStart); d <= wkEnd; d = addDays(d, 1)) if (ev.days.indexOf(d.getDay()) > -1) return true;
      return false;
    }
    var s = day(ev.start), e = day(ev.end) || s;
    return !!s && s <= wkEnd && e >= wkStart;
  }
  function isPast(ev) {
    if (!ev.start) return false;
    var e = day(ev.end) || day(ev.start);
    return e < today;
  }
  function matches(ev) {
    if (isPast(ev)) return false;
    if (state.cat === "free") { if (!ev.free) return false; }
    else if (state.cat !== "all" && ev.cat !== state.cat) return false;
    if (state.weekend && !overlapsWeekend(ev)) return false;
    if (state.city && ev.city !== state.city) return false;
    if (state.q) {
      var hay = [ev.title, ev.where, ev.blurb, ev.when, ev.cat].join(" ").toLowerCase();
      if (hay.indexOf(state.q) < 0) return false;
    }
    return true;
  }

  function dateBlock(ev) {
    var b = el("div", "date");
    b.setAttribute("aria-hidden", "true");
    var s = day(ev.start);
    if (!s) {
      var ds = (ev.days || []).slice().sort();
      if (!ds.length) {
        b.appendChild(el("span", "t", "Go-to"));
        b.appendChild(el("span", "n s", "Eat"));
        return b;
      }
      b.appendChild(el("span", "t", "Every"));
      var label;
      if (ds.length === 7) label = "Day";
      else if (ds.length === 5 && ds.join() === "1,2,3,4,5") label = "Wkdy";
      else label = ds.map(function (d) { return DOW[d].toUpperCase(); }).join("·");
      b.appendChild(el("span", "n s", label));
      return b;
    }
    var e = day(ev.end);
    if (e && s < today) {
      b.appendChild(el("span", "t", "Thru"));
      b.appendChild(el("span", "n s", MON[e.getMonth()] + " " + e.getDate()));
      return b;
    }
    b.appendChild(el("span", "t", MON[s.getMonth()]));
    var n = String(s.getDate());
    if (e && e.getTime() !== s.getTime() && e.getMonth() === s.getMonth()) n += "–" + e.getDate();
    b.appendChild(el("span", n.length > 3 ? "n s" : "n", n));
    return b;
  }

  function card(ev) {
    var li = el("li", "card");
    li.appendChild(dateBlock(ev));
    var body = el("div", "body");
    var tags = el("div", "tags");
    if (overlapsWeekend(ev) && ev.start) tags.appendChild(el("span", "badge", "This weekend"));
    tags.appendChild(el("span", null, CATNAME[ev.cat] || ev.cat));
    body.appendChild(tags);
    body.appendChild(el("h3", null, ev.title));
    if (ev.when) body.appendChild(el("div", "when", ev.when));
    if (ev.blurb) body.appendChild(el("p", "blurb", ev.blurb));
    var foot = el("div", "foot");
    if (ev.where) {
      var loc = ev.where;
      if (ev.city && loc.toLowerCase().indexOf(ev.city.toLowerCase().split(" ")[0]) < 0) loc += ", " + ev.city;
      foot.appendChild(el("span", "place", loc));
    }
    if (ev.price) foot.appendChild(el("span", "price", ev.price));
    if (ev.url && /^https:\/\//.test(ev.url)) {
      var a = el("a", "src", "Details");
      a.href = ev.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      foot.appendChild(a);
    }
    body.appendChild(foot);
    li.appendChild(body);
    return li;
  }

  function section(title, note, list) {
    var wrap = document.createElement("section");
    var h = el("h2", null, title);
    h.appendChild(el("small", null, note));
    wrap.appendChild(h);
    var ul = el("ul", "grid");
    wrap.style.display = "flex"; wrap.style.flexDirection = "column"; wrap.style.gap = "12px";
    list.forEach(function (ev) { ul.appendChild(card(ev)); });
    wrap.appendChild(ul);
    return wrap;
  }

  function message(text, withReset) {
    out.textContent = "";
    var s = el("div", "state", text);
    if (withReset) {
      var btn = el("button", "chip", "Clear filters");
      btn.addEventListener("click", function () { state.cat = "all"; state.weekend = false; state.q = ""; state.city = ""; $("q").value = ""; $("city").value = ""; syncControls(); render(); });
      s.appendChild(document.createElement("br"));
      s.appendChild(btn);
    }
    out.appendChild(s);
  }

  function render() {
    var weekendCount = events.filter(function (e) { return !isPast(e) && e.start && overlapsWeekend(e); }).length;
    $("sub").textContent = phase === "ready" && events.length
      ? weekendCount + " dated things on this weekend, plus markets, free museum days, beaches and pizza that run all week."
      : "Markets, pop-ups, shows, theme parks, beaches, free days and pizza across Los Angeles.";

    if (phase === "loading") return message("Loading events…");
    if (phase === "signedout") return message("Unable to load events.");
    if (!events.length) return message("No events loaded yet. Ask Claude to refresh the list.");

    var list = events.filter(matches);
    if (!list.length) return message(state.city ? "No listings for " + state.city + " with these filters yet. Ask Claude to search that city." : "Nothing matches those filters.", true);

    var dated = list.filter(function (e) { return e.start; });
    var weekly = list.filter(function (e) { return !e.start; });
    function key(e) { var s = day(e.start); return s < today ? today : s; }
    dated.sort(function (a, b) { return key(a) - key(b) || (day(a.end) || 0) - (day(b.end) || 0) || a.title.localeCompare(b.title); });
    weekly.sort(function (a, b) { return a.cat.localeCompare(b.cat) || a.title.localeCompare(b.title); });

    out.textContent = "";
    var col = el("div"); col.style.display = "flex"; col.style.flexDirection = "column"; col.style.gap = "24px";
    if (dated.length) col.appendChild(section("Coming up", dated.length + " dated", dated));
    if (weekly.length) col.appendChild(section("Every week", weekly.length + " standing", weekly));
    out.appendChild(col);
  }

  function syncControls() {
    Array.prototype.forEach.call($("chips").children, function (b) { b.setAttribute("aria-pressed", String(b.dataset.cat === state.cat)); });
    $("wk").setAttribute("aria-pressed", String(state.weekend));
  }

  CATS.forEach(function (c) {
    var b = el("button", "chip", c[1]);
    b.dataset.cat = c[0];
    b.setAttribute("aria-pressed", String(c[0] === "all"));
    b.addEventListener("click", function () { state.cat = c[0]; syncControls(); render(); });
    $("chips").appendChild(b);
  });
  $("wk").addEventListener("click", function () { state.weekend = !state.weekend; syncControls(); render(); });
  var citySel = $("city");
  [""].concat(CITIES).forEach(function (c) {
    var o = document.createElement("option");
    o.value = c; o.textContent = c || "All cities";
    citySel.appendChild(o);
  });
  citySel.addEventListener("change", function () { state.city = citySel.value; render(); });
  $("q").addEventListener("input", function (e) { state.q = e.target.value.trim().toLowerCase(); render(); });

  $("exit").textContent = DOW[today.getDay()] + " " + MON[today.getMonth()] + " " + today.getDate();
  syncControls();
  render();

  // Fetch published JSON; do not cache stale event lists.
  fetch("./events.json?ts=" + Date.now(), {cache: "no-store"})
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (data) {
      if (!data || !Array.isArray(data.events)) throw new Error("Invalid events data");
      events = data.events;
      phase = "ready";
      render();
      if (data.meta) $("stamp").textContent = "List refreshed " + (data.meta.updated || "unknown") + (data.meta.note ? ". " + data.meta.note : "");
    })
    .catch(function (err) {
      phase = "error";
      message("Could not load events.json. Open this website through GitHub Pages or a local web server. " + err.message);
    });

})();
</script>

</body>
</html>
